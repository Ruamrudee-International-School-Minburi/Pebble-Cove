<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pebble Cove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#233238; --ink-soft:#56686e; --paper:#fffaf0; --paper-2:#f3e9d2; --line:rgba(35,50,56,.14);
  --sun:#ffc93c; --sea:#2d9cb8; --leaf:#3f9a52; --coral:#ef5f52; --edge:#233238;
  --font:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#f4efe2; --ink-soft:#b6c2c3; --paper:#1e2c32; --paper-2:#2a3c43; --line:rgba(244,239,226,.14); --edge:#0f191d; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#f4efe2; --ink-soft:#b6c2c3; --paper:#1e2c32; --paper-2:#2a3c43; --line:rgba(244,239,226,.14); --edge:#0f191d; color-scheme:dark; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; overflow:hidden; background:#2b8db3; font-family:var(--font); color:var(--ink);
  user-select:none; -webkit-user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
*,*::before,*::after{box-sizing:inherit}
#game{position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab}
#game:active{cursor:grabbing}
button{font-family:inherit}
.hidden{display:none !important}

/* ---------- buttons ---------- */
.btn{font:700 18px/1.1 var(--font); padding:12px 18px 9px; border:3px solid #233238; border-radius:16px; background:var(--sun);
  color:#233238; box-shadow:0 4px 0 #233238; cursor:pointer; transition:transform .06s, box-shadow .06s; text-align:left}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #233238}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,.slot:focus-visible{outline:3px solid var(--sea); outline-offset:3px}
.btn.alt{background:#eaf5ef}
.btn.sea{background:#8fd3e3}
.btn.red{background:#ffb4a8}
.btn.small{font-size:15px; padding:8px 12px 6px; border-radius:12px; box-shadow:0 3px 0 #233238}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:0 4px 0 #233238}
.btn.small[disabled]{box-shadow:0 3px 0 #233238}

/* ---------- title ---------- */
#title{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px) calc(env(safe-area-inset-left,0px) + clamp(24px,7vw,96px));
  background:linear-gradient(90deg, rgba(20,52,60,.55) 0%, rgba(20,52,60,.18) 48%, rgba(20,52,60,0) 70%)}
#title h1{margin:0; font-weight:800; font-size:clamp(56px,11vw,112px); line-height:.86; letter-spacing:-.02em; color:#fffaf0;
  -webkit-text-stroke:4px #233238; paint-order:stroke fill; text-shadow:0 7px 0 #233238}
#title .sub{margin:14px 0 26px; font-size:clamp(17px,2.2vw,22px); font-weight:600; color:#fffaf0; text-shadow:0 2px 0 rgba(35,50,56,.7); max-width:30ch}
#title .menu{display:flex; flex-direction:column; gap:12px; width:min(300px,100%)}
#title .menu .btn{font-size:20px}
#saveNote{margin-top:22px; font-size:14px; font-weight:600; color:#fffaf0; opacity:.85; text-shadow:0 1px 0 rgba(35,50,56,.8)}
@media (max-width:600px){
  #title{justify-content:flex-end; background:linear-gradient(0deg, rgba(20,52,60,.6) 0%, rgba(20,52,60,.15) 55%, rgba(20,52,60,0) 75%)}
  #title .menu{width:100%}
}

/* ---------- HUD ---------- */
#hud{position:fixed; inset:0; z-index:10; pointer-events:none}
.hudbox{position:absolute; display:flex; gap:8px; align-items:flex-start}
#hudL{top:calc(env(safe-area-inset-top,0px) + 10px); left:calc(env(safe-area-inset-left,0px) + 10px); flex-direction:column}
#hudR{top:calc(env(safe-area-inset-top,0px) + 10px); right:calc(env(safe-area-inset-right,0px) + 10px); pointer-events:auto}
.chip{background:var(--paper); color:var(--ink); border:2.5px solid var(--edge); border-radius:14px; padding:4px 10px 2px; font-weight:700; font-size:17px;
  display:flex; align-items:center; gap:7px; box-shadow:0 3px 0 rgba(35,50,56,.35); line-height:1.2}
button.chip{cursor:pointer; padding:6px 10px 4px}
button.chip svg{width:20px; height:20px}
.row{display:flex; gap:8px; align-items:center}
.meter{width:96px; height:10px; border-radius:6px; background:var(--line); overflow:hidden}
.meter i{display:block; height:100%; width:50%; border-radius:6px; transition:width .3s}
#mFood i{background:#f08a3c} #mEnergy i{background:#4bb7d3}
.meter.low i{background:var(--coral) !important}
.ico{width:16px; height:16px; flex:none}
#goalChip{font-size:14px; font-weight:600; max-width:min(320px,62vw)}
#goalChip b{font-weight:800}
#jobChip{font-size:14px; font-weight:600}
#prompt{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 26px); z-index:11; pointer-events:none}
#prompt kbd{font:800 14px/1 var(--font); background:var(--sun); color:#233238; border:2px solid #233238; border-radius:7px; padding:3px 7px 1px}
#toasts{position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 64px); z-index:12; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; width:min(460px,92vw)}
.toast{background:var(--paper); color:var(--ink); border:2.5px solid var(--edge); border-radius:14px; padding:6px 14px 4px; font-weight:600; font-size:16px; text-align:center;
  box-shadow:0 3px 0 rgba(35,50,56,.35); animation:tin .25s ease-out}
.toast.good{background:#d9f2dc; color:#233238} .toast.bad{background:#ffd9d2; color:#233238}
.toast.out{opacity:0; transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px); opacity:0}}
#region{position:fixed; left:0; right:0; top:28%; text-align:center; z-index:9; pointer-events:none; font-weight:800; font-size:clamp(30px,6vw,54px); color:#fffaf0;
  -webkit-text-stroke:3px #233238; paint-order:stroke fill; text-shadow:0 5px 0 #233238; opacity:0; transition:opacity .6s}
#region.on{opacity:1}
#fade{position:fixed; inset:0; background:#0e1c22; z-index:40; opacity:0; pointer-events:none; transition:opacity .45s}
#fade.on{opacity:1; pointer-events:auto}

/* ---------- fishing reel ---------- */
#reel{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 120px); z-index:13; width:min(340px,86vw);
  background:var(--paper); border:3px solid var(--edge); border-radius:18px; padding:10px 14px 14px; box-shadow:0 4px 0 rgba(35,50,56,.4); text-align:center}
#reel p{margin:0 0 8px; font-weight:700}
#reelBar{position:relative; height:26px; border-radius:13px; background:#cfe9ef; border:2.5px solid #233238; overflow:hidden; cursor:pointer; pointer-events:auto}
#reelZone{position:absolute; top:0; bottom:0; background:#7fd08c}
#reelMark{position:absolute; top:-2px; bottom:-2px; width:6px; margin-left:-3px; background:#233238; border-radius:3px}

/* ---------- modal ---------- */
#modal{position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:rgba(16,36,44,.42);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
#modal.show{display:flex}
.sheet{background:var(--paper); color:var(--ink); border:3px solid var(--edge); border-radius:26px; box-shadow:0 8px 0 rgba(35,50,56,.45);
  width:min(480px,100%); max-height:100%; overflow:auto; padding:18px 20px 22px; animation:pop .18s ease-out; -webkit-overflow-scrolling:touch; touch-action:pan-y}
.sheet.wide{width:min(720px,100%)}
@keyframes pop{from{transform:scale(.96); opacity:.4}}
.sheet h2{margin:0 0 4px; font-size:30px; font-weight:800; line-height:1.05}
.sheet .lead{margin:0 0 14px; color:var(--ink-soft); font-weight:500; font-size:16px; line-height:1.4; max-width:60ch}
.stack{display:flex; flex-direction:column; gap:10px}
.sheet .head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px}
.close{flex:none}
.list{display:flex; flex-direction:column; gap:8px; margin:6px 0 12px}
.item{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:16px; background:var(--paper-2)}
.item .em{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:24px; flex:none; border:2px solid rgba(35,50,56,.25)}
.item .txt{flex:1; min-width:0}
.item .txt b{display:block; font-size:17px; line-height:1.15}
.item .txt span{display:block; font-size:14px; color:var(--ink-soft); line-height:1.3}
.item .btn{flex:none}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin:8px 0 12px}
.slot{aspect-ratio:1; border-radius:14px; background:var(--paper-2); border:2.5px solid var(--line); display:grid; place-items:center; font-size:28px; position:relative; cursor:pointer; padding:0; color:var(--ink)}
.slot.sel{border-color:var(--sea); box-shadow:0 0 0 3px var(--sea) inset}
.slot small{position:absolute; right:6px; bottom:2px; font-size:14px; font-weight:800}
.slot.empty{cursor:default; opacity:.6}
.kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:15px; color:var(--ink-soft); margin:4px 0 10px}
.kv b{color:var(--ink)}
.field{display:flex; flex-direction:column; gap:6px; margin:10px 0}
.field label{font-weight:700; font-size:16px}
.field input[type=text]{font:600 18px var(--font); padding:10px 12px 8px; border-radius:12px; border:2.5px solid var(--edge); background:var(--paper-2); color:var(--ink)}
.field input[type=range]{width:100%; accent-color:var(--sea)}
.swatches{display:flex; gap:8px; flex-wrap:wrap}
.sw{width:38px; height:38px; border-radius:50%; border:3px solid rgba(35,50,56,.25); cursor:pointer; padding:0}
.sw.on{border-color:var(--ink); box-shadow:0 0 0 3px var(--paper) inset}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg .btn{background:#eaf5ef}
.seg .btn.on{background:var(--sun)}
.newwrap{display:grid; grid-template-columns:1fr 128px; gap:14px; align-items:start}
#lookPrev{width:128px; height:128px; border-radius:20px; background:#93cf6a; border:3px solid var(--edge)}
.goal{display:flex; gap:10px; align-items:flex-start; padding:8px 4px; border-bottom:1.5px solid var(--line)}
.goal .tick{width:24px; height:24px; border-radius:50%; border:2.5px solid var(--ink-soft); flex:none; display:grid; place-items:center; font-weight:800; font-size:14px}
.goal.done .tick{background:var(--leaf); border-color:var(--leaf); color:#fff}
.goal.done .gt{text-decoration:line-through; color:var(--ink-soft)}
.goal .rw{margin-left:auto; font-weight:700; white-space:nowrap}
#mapCanvas{width:100%; height:auto; border-radius:16px; border:3px solid var(--edge); display:block; background:#2b8db3}
.howto p{margin:0 0 10px; line-height:1.45; font-size:16px}
.howto kbd{font:800 13px/1 var(--font); background:var(--sun); color:#233238; border:2px solid #233238; border-radius:6px; padding:2px 6px 0}
.money-line{font-weight:800; font-size:18px}

/* ---------- touch ---------- */
#touch{position:fixed; inset:0; z-index:9; pointer-events:none}
#stickZone{position:absolute; left:0; bottom:0; width:50%; height:62%; pointer-events:auto}
#stickBase{position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:rgba(255,250,240,.28); border:3px solid rgba(35,50,56,.45); display:none}
#stickKnob{position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:var(--paper); border:3px solid #233238}
#tbtns{position:absolute; right:calc(env(safe-area-inset-right,0px) + 14px); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; gap:12px; pointer-events:auto; align-items:end}
.tb{width:64px; height:64px; border-radius:50%; border:3px solid #233238; background:#eaf5ef; color:#233238; font:800 14px/1 var(--font); box-shadow:0 4px 0 #233238; padding:0}
.tb:active,.tb.down{transform:translateY(3px); box-shadow:0 1px 0 #233238}
.tb.big{width:86px; height:86px; background:var(--sun); font-size:15px; grid-row:1 / span 2; grid-column:2; padding:6px; line-height:1.05}
#tbtns{grid-template-columns:auto auto auto}
.tb.big{grid-column:3}
#tRun{grid-column:2; grid-row:2} #tSneak{grid-column:2; grid-row:1} #tRide{grid-column:1; grid-row:2}
#lookZone{position:absolute; right:0; top:0; width:50%; height:100%; pointer-events:auto}
#labels{position:fixed; inset:0; pointer-events:none; z-index:8; overflow:hidden}
.lbl{position:absolute; left:0; top:0; transform:translate(-50%,-100%); background:#fffaf0; color:#233238; border:2px solid #233238; border-radius:10px; padding:1px 8px 0; font-weight:700; font-size:14px; white-space:nowrap; will-change:transform}
.lbl::after{content:""; position:absolute; left:50%; bottom:-7px; margin-left:-5px; border:5px solid transparent; border-top-color:#233238; border-bottom:0}
.lbl.warn{background:#ffd9d2} .lbl.yel{background:#ffc93c} .lbl.ok{background:#d9f2dc} .lbl.zzz{background:#dfe6ff}
#edgeArrow{position:fixed; left:0; top:0; z-index:8; pointer-events:none; width:40px; height:40px; margin:-20px 0 0 -20px}
#loading{position:fixed; inset:0; display:grid; place-items:center; background:#2b8db3; color:#fffaf0; font-weight:800; font-size:24px; z-index:50}
@media (max-width:440px){
  #dayT{display:none}
  .chip{font-size:15px; padding:3px 8px 1px}
  button.chip{padding:5px 8px 3px}
  .meter{width:78px}
  #goalChip{font-size:13px; max-width:58vw}
  #toasts{top:calc(env(safe-area-inset-top,0px) + 170px)}
  .toast{font-size:15px}
}
@media (prefers-reduced-motion: reduce){ .sheet,.toast{animation:none} #region{transition:none} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Building Pebble Cove…</div>

<div id="hud" class="hidden">
  <div id="hudL" class="hudbox">
    <div class="row">
      <div class="chip" title="Money"><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#ffc93c" stroke="#233238" stroke-width="1.6"/><path d="M8 4.2v7.6M10 5.6c-.5-.6-1.2-.9-2-.9-1.1 0-1.9.6-1.9 1.4 0 1.9 4 1 4 2.9 0 .8-.9 1.5-2.1 1.5-.9 0-1.6-.3-2.1-.9" fill="none" stroke="#233238" stroke-width="1.3" stroke-linecap="round"/></svg><span id="moneyT">$0</span></div>
      <div class="chip" title="Time"><span id="clockT">7:00</span><span id="dayT" style="color:var(--ink-soft);font-weight:600">Day 1</span></div>
    </div>
    <div class="chip" style="flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px">
      <div class="row" title="Food"><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="9.5" r="5.6" fill="#f08a3c" stroke="#233238" stroke-width="1.4"/><path d="M8 4c0-1.4.8-2.4 2.2-2.6" fill="none" stroke="#233238" stroke-width="1.4" stroke-linecap="round"/></svg><div id="mFood" class="meter"><i></i></div></div>
      <div class="row" title="Energy"><svg class="ico" viewBox="0 0 16 16"><path d="M9.5 1 3.5 9h4l-1 6 6-8h-4z" fill="#4bb7d3" stroke="#233238" stroke-width="1.3" stroke-linejoin="round"/></svg><div id="mEnergy" class="meter"><i></i></div></div>
    </div>
    <div id="goalChip" class="chip"></div>
    <div id="jobChip" class="chip hidden"></div>
  </div>
  <div id="hudR" class="hudbox">
    <button class="chip" id="bBag" aria-label="Bag"><svg viewBox="0 0 20 20"><path d="M5 7h10l1 10H4z" fill="#e8a35a" stroke="#233238" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 7V5.5a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="#233238" stroke-width="1.6"/></svg></button>
    <button class="chip" id="bMap" aria-label="Map"><svg viewBox="0 0 20 20"><path d="M2.5 4.5 7.5 3l5 1.5 5-1.5v12l-5 1.5-5-1.5-5 1.5z" fill="#8fd3e3" stroke="#233238" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 3v12M12.5 4.5v12" stroke="#233238" stroke-width="1.4"/></svg></button>
    <button class="chip" id="bPause" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
</div>

<div id="prompt" class="chip hidden"></div>
<div id="toasts"></div>
<div id="region"></div>

<div id="reel" class="hidden"><p id="reelMsg">Something's biting!</p><div id="reelBar"><div id="reelZone"></div><div id="reelMark"></div></div></div>

<div id="labels"></div>
<div id="edgeArrow" class="hidden"><svg viewBox="0 0 40 40" width="40" height="40"><path d="M36 20 8 6l6 14-6 14z" fill="#ffc93c" stroke="#233238" stroke-width="3" stroke-linejoin="round"/></svg></div>
<div id="touch" class="hidden">
  <div id="lookZone"></div>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="tbtns">
    <button class="tb" id="tRide">Ride</button>
    <button class="tb" id="tSneak">Sneak</button>
    <button class="tb" id="tRun">Run</button>
    <button class="tb big" id="tAct">Use</button>
  </div>
</div>

<div id="title">
  <h1>Pebble<br>Cove</h1>
  <p class="sub">A little life by the sea. Fish, forage, do odd jobs and sneak the odd snack.</p>
  <div class="menu">
    <button class="btn" id="tContinue">Continue</button>
    <button class="btn alt" id="tNew">New game</button>
    <button class="btn alt" id="tLoad">Load game</button>
    <button class="btn alt" id="tSettings">Settings</button>
    <button class="btn alt" id="tHow">How to play</button>
  </div>
  <div id="saveNote">Saves are kept in this browser.</div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="fade"></div>
<script>
'use strict';
(function(){
if(!window.THREE){ document.getElementById('loading').textContent='The 3D engine didn\u2019t load. Check your connection and reload the page.'; return; }
/* ================= utilities ================= */
const TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function angDiff(a,b){let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296;}
function wpick(table,r){let tot=0;for(const t of table)tot+=t[1];let v=(r||Math.random())*tot;for(const t of table){v-=t[1];if(v<=0)return t[0];}return table[0][0];}
function fmtTime(m){m=((Math.floor(m)%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;const ap=h<12?'am':'pm';let hh=h%12;if(hh===0)hh=12;return hh+':'+String(mm).padStart(2,'0')+' '+ap;}
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const an=w=>(/^[aeiou]/i.test(w)?'an ':'a ')+w;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ================= storage ================= */
const SK='pebblecove.';
function loadJSON(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function delKey(k){try{localStorage.removeItem(k);}catch(e){}}
const settings=Object.assign({vol:0.6,amb:0.7,zoom:1,touch:'auto',cones:true,gfx:(Math.min(screen.width,screen.height)<600?'low':'high')},loadJSON(SK+'settings')||{});
function saveSettings(){saveJSON(SK+'settings',settings);}

const Cloud={db:null,uid:null,ready:false,
  async init(){
    try{
      if(!window.claude||typeof window.claude.use!=='function') return;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user) return;
      const uid=await user.id(); if(!uid) return;
      this.db=db; this.uid=uid; this.ready=true;
      await this.pull();
    }catch(e){ this.ready=false; }
    refreshSaveNote();
  },
  ref(n){return this.db.collection('data/users/'+this.uid).doc('slot'+n);},
  async pull(){
    for(let n=1;n<=3;n++){
      try{
        const snap=await this.ref(n).get();
        if(snap.exists){const d=snap.data(); if(d&&typeof d.json==='string'){const cd=JSON.parse(d.json); const local=loadJSON(SK+'slot'+n); if(!local||(cd.savedAt||0)>(local.savedAt||0)) saveJSON(SK+'slot'+n,cd);}}
      }catch(e){}
    }
    updateTitleButtons();
  },
  push(n,data){ if(!this.ready) return; try{ this.ref(n).set({json:JSON.stringify(data),savedAt:data.savedAt||0}).catch(()=>{}); }catch(e){} },
  del(n){ if(!this.ready) return; try{ this.ref(n).delete().catch(()=>{}); }catch(e){} }
};

function slotData(n){return loadJSON(SK+'slot'+n);}
function anySave(){let best=null;for(let n=1;n<=3;n++){const d=slotData(n);if(d&&(!best||d.savedAt>best.savedAt))best=d;}return best;}

/* ================= world constants & map ================= */
const TS=40, MW=90, MH=64, WW=MW*TS, WH=MH*TS;
const T={DEEP:0,WATER:1,SAND:2,GRASS:3,PATH:4,PLAZA:5,FIELD:6,PIER:7,DARK:8};
const map=new Uint8Array(MW*MH), wreg=new Uint8Array(MW*MH); // wreg 1 sea, 2 lake, 3 river
const I=(x,y)=>y*MW+x;
function tAt(x,y){return (x<0||y<0||x>=MW||y>=MH)?T.DEEP:map[I(x,y)];}
function tPx(x,y){return tAt(Math.floor(x/TS),Math.floor(y/TS));}
function fillR(x0,y0,x1,y1,t,ok){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(x<0||y<0||x>=MW||y>=MH)continue;if(ok&&!ok(map[I(x,y)]))continue;map[I(x,y)]=t;}}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
const westCoast=y=>7+Math.sin(y*.31)*1.4+Math.sin(y*.11+1)*1.2;
const southCoast=x=>45+Math.sin(x*.23)*1.3+Math.sin(x*.09+2)*1.1;
const RIVER=[[68,15],[65.5,21],[63.5,28],[62.5,35],[60.5,41],[59,49]];
const LAKE={x:72,y:10.5,rx:8.5,ry:5.2};
const ISLE={x:22,y:57.5,rx:6.5,ry:4.2};
const CAMP={x:35.5,y:9.5,rx:8.5,ry:5};
const lakeE=(x,y)=>((x-LAKE.x)/LAKE.rx)**2+((y-LAKE.y)/LAKE.ry)**2;
const isleE=(x,y)=>((x-ISLE.x)/ISLE.rx)**2+((y-ISLE.y)/ISLE.ry)**2;
const campE=(x,y)=>((x-CAMP.x)/CAMP.rx)**2+((y-CAMP.y)/CAMP.ry)**2;

function genMap(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const cx=x+.5,cy=y+.5;
    const d=Math.min(cx-westCoast(cy),southCoast(cx)-cy);
    let t=d>=3?T.GRASS:d>=0?T.SAND:d>-3.5?T.WATER:T.DEEP;
    const e=isleE(cx,cy);
    if(e<.5)t=T.GRASS;else if(e<1)t=T.SAND;else if(e<1.9&&t===T.DEEP)t=T.WATER;
    map[I(x,y)]=t; if(t<=T.WATER) wreg[I(x,y)]=1;
    const le=lakeE(cx,cy);
    if(le<.35){map[I(x,y)]=T.DEEP;wreg[I(x,y)]=2;}
    else if(le<1){map[I(x,y)]=T.WATER;wreg[I(x,y)]=2;}
    else if(le<1.35&&map[I(x,y)]===T.GRASS)map[I(x,y)]=T.SAND;
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const cx=x+.5,cy=y+.5; let m=99;
    for(let i=0;i<RIVER.length-1;i++)m=Math.min(m,segDist(cx,cy,RIVER[i][0],RIVER[i][1],RIVER[i+1][0],RIVER[i+1][1]));
    const t=map[I(x,y)];
    if(m<1.35&&(t===T.GRASS||t===T.SAND)){map[I(x,y)]=T.WATER;wreg[I(x,y)]=3;}
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const cx=x+.5,cy=y+.5;
    if(map[I(x,y)]!==T.GRASS)continue;
    if((cy<17.5&&cx<61&&campE(cx,cy)>1)||cx>84.5||(cy<5&&cx>=61)) map[I(x,y)]=T.DARK;
  }
  const land=t=>t!==T.WATER&&t!==T.DEEP;
  fillR(9,28,86,29,T.PATH,land);
  for(let x=9;x<=86;x++)for(let y=28;y<=29;y++)if(map[I(x,y)]===T.WATER)map[I(x,y)]=T.PIER;
  fillR(40,8,41,27,T.PATH,land);
  fillR(40,30,41,42,T.PATH,land);
  fillR(24,25,25,27,T.PATH,land);
  fillR(70,30,71,35,T.PATH,land);
  fillR(75,16,76,27,T.PATH,land);
  fillR(34,22,46,33,T.PLAZA,land);
  fillR(66,36,84,41,T.FIELD,t=>t===T.GRASS||t===T.DARK);
  const wat=t=>t===T.WATER||t===T.DEEP;
  fillR(47,43,48,55,T.PIER,wat);
  fillR(21,50,22,54,T.PIER,wat);
  fillR(72,13,72,15,T.PIER,wat);
}

const OFF=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]];
function walkable(mode,t){
  if(mode==='boat') return t===T.WATER||t===T.DEEP;
  if(mode==='scooter'||mode==='npc') return t!==T.WATER&&t!==T.DEEP;
  return t!==T.DEEP;
}
function collides(x,y,r,mode){
  if(x<r||y<r||x>WW-r||y>WH-r) return true;
  for(const o of OFF) if(!walkable(mode,tPx(x+o[0]*r,y+o[1]*r))) return true;
  if(mode==='boat') return false;
  const gx=Math.floor(x/SG),gy=Math.floor(y/SG);
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    const L=sgrid.get((gx+i)+','+(gy+j)); if(!L) continue;
    for(const s of L){
      if(s.r){ if((x-s.cx)**2+(y-s.cy)**2<(r+s.r)**2) return true; }
      else { const nx=clamp(x,s.x,s.x+s.w),ny=clamp(y,s.y,s.y+s.h); if((x-nx)**2+(y-ny)**2<r*r) return true; }
    }
  }
  return false;
}
function moveEnt(e,dx,dy,r,mode){
  let moved=false;
  if(dx&&!collides(e.x+dx,e.y,r,mode)){e.x+=dx;moved=true;}
  if(dy&&!collides(e.x,e.y+dy,r,mode)){e.y+=dy;moved=true;}
  return moved;
}

function mkPicnic(zone,bx,by,face,away){

  p.x=bx; p.y=by; p.face=face; refill(pc); return pc;

function refill(pc){pc.cooler.snacks=[];const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)pc.cooler.snacks.push(pick(SNACKS));}
function mkGuard(o){const g=mkPerson(o); g.x=o.patrol[0][0]; g.y=o.patrol[0][1]; g.pi=0; g.state='patrol'; g.wait=0; g.lostT=0; g.bubble=null; g.spd=62; g.pants='#2f3f4a'; return g;}
function newGull(g){const x=rnd(10,58); g.x=x*TS; g.y=(southCoast(x)-rnd(.6,3))*TS; g.state='idle'; g.z=0; g.t=rnd(0,5); g.face=Math.random()*TAU; g.vx=0; g.vy=0; g.gone=0; return g;}

const npcActive=()=>hourIn(8,19);
const zoneActive=z=>z==='camp'?true:hourIn(8,19);
const guardActive=g=>g.zone==='camp'?true:hourIn(8,19.5);
const watching=pc=>pc.state==='sit'||pc.state==='fire';
const grabbable=pc=>zoneActive(pc.zone)&&!watching(pc)&&pc.state!=='back'&&pc.cooler.snacks.length>0;
function walkTo(e,tx,ty,spd,dt){
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
  if(d<3){e.moving=false;return true;}
  const s=Math.min(d,spd*dt); e.x+=dx/d*s; e.y+=dy/d*s; e.face=Math.atan2(dy,dx); e.moving=true; e.walkT+=dt; return false;
}
function updateNPCs(dt){
  const t=clock();
  // townsfolk
  for(const n of towns){
    if(n.wait>0){n.wait-=dt;n.moving=false;continue;}
    const tg=NODES[n.next];
    if(walkTo(n,tg[0]*TS,tg[1]*TS,n.spd,dt)){ const prev=n.node; n.node=n.next; const opts=ADJ[n.node].filter(k=>k!==prev); n.next=pick(opts.length?opts:ADJ[n.node]); if(Math.random()<.3) n.wait=rnd(1,4); }
  }
  // picnickers
  for(const pc of picnics){
    const p=pc.p;
    if(pc.zone==='camp'){
      const night=t>=22*60||t<6*60, eve=t>=18*60&&t<22*60;
      if(night&&pc.state!=='sleep'&&pc.state!=='toTent'){pc.state='toTent';}
      else if(eve&&!['fire','toFire'].includes(pc.state)){pc.state='toFire';}
      else if(!night&&!eve&&['sleep','toTent','fire','toFire'].includes(pc.state)){pc.state='sit'; p.x=pc.bx; p.y=pc.by; pc.timer=rnd(6,20); if(pc.cooler.snacks.length<2) refill(pc);}
      if(pc.state==='toTent'){ if(walkTo(p,pc.tent.x,pc.tent.y,55,dt)) pc.state='sleep'; continue; }
      if(pc.state==='sleep'){ p.moving=false; continue; }
      if(pc.state==='toFire'){ if(walkTo(p,pc.fire.x,pc.fire.y,55,dt)){pc.state='fire'; p.face=pc.fire.face;} continue; }
      if(pc.state==='fire'){ p.moving=false; pc.lookT-=dt; if(pc.lookT<=0){pc.lookT=rnd(2,4); pc.look=pc.fire.face+rnd(-1.4,1.4);} p.face+=angDiff(pc.look||pc.fire.face,p.face)*Math.min(1,dt*3); continue; }
    }
    if(pc.state==='sit'){
      p.x=pc.bx; p.y=pc.by; p.moving=false;
      pc.lookT-=dt; if(pc.lookT<=0){pc.lookT=rnd(1.5,3.5); pc.look=pc.face0+rnd(-1.3,1.3);}
      p.face+=angDiff(pc.look||pc.face0,p.face)*Math.min(1,dt*4);
      pc.timer-=dt; if(pc.timer<=0){pc.state='leave'; pc.target=pick(pc.away);}
    }else if(pc.state==='leave'){
      if(walkTo(p,pc.target[0],pc.target[1],55,dt)){pc.state='away'; pc.timer=rnd(16,30);}
    }else if(pc.state==='away'){
      p.moving=false; pc.timer-=dt; if(pc.timer<=0) pc.state='back';
    }else if(pc.state==='back'){
      if(walkTo(p,pc.bx,pc.by,55,dt)){pc.state='sit'; pc.timer=rnd(14,28); p.face=pc.face0; if(pc.cooler.snacks.length===0&&Math.random()<.7) refill(pc);}
    }
  }
  // guards
  for(const g of guards){
    if(g.bubble){g.bubble.t-=dt; if(g.bubble.t<=0) g.bubble=null;}
    if(g.state==='patrol'){
      if(g.wait>0){g.wait-=dt; g.moving=false; g.face+=Math.sin(G.time*1.3+g.pi)*dt*1.4; continue;}
      const w=g.patrol[g.pi];
      if(walkTo(g,w[0],w[1],g.spd,dt)){g.pi=(g.pi+1)%g.patrol.length; g.wait=rnd(1,2.5);}
    }else if(g.state==='chase'&&P&&S.inside){ g.state='return'; g.bubble={t:2,txt:'Where did they go?'};
    }else if(g.state==='chase'&&P){
      const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy);
      const spd=(darkAmt>.5?140:155);
      const st=spd*dt;
      if(d>1){ const mx=dx/d*st,my=dy/d*st; if(!moveEnt(g,mx,my,10,'npc')){ g.x+=mx*.5; g.y+=my*.5; } g.face=Math.atan2(dy,dx); g.moving=true; g.walkT+=dt; }
      if(!sees(g,1.4)||S.mode==='boat'||S.mode==='car') g.lostT+=dt; else g.lostT=0;
      const fromHome=dist(g.x,g.y,g.lc[0],g.lc[1]);
      if(d<22&&!P.hidden&&S.mode!=='boat'&&S.mode!=='car'){ busted(g); }
      else if(g.lostT>2.2||fromHome>g.leash){ g.state='return'; g.bubble={t:2,txt:fromHome>g.leash?'And stay out!':'Where did they go?'}; }
    }else if(g.state==='return'){
      let bi=0,bd=1e9; g.patrol.forEach((w,i)=>{const d=dist(w[0],w[1],g.x,g.y); if(d<bd){bd=d;bi=i;}});
      if(walkTo(g,g.patrol[bi][0],g.patrol[bi][1],g.spd*1.2,dt)){g.state='patrol'; g.pi=bi; g.wait=1;}
    }
  }
  // gulls
  for(const g of gulls){
    if(g.state==='idle'){
      g.t+=dt; if(P&&G.mode==='play'&&dist(P.x,P.y,g.x,g.y)<90&&!P.hidden){ g.state='fly'; sfxAt('gull',g.x,g.y,400); const a=Math.atan2(g.y-P.y,g.x-P.x)+rnd(-.5,.5); g.vx=Math.cos(a)*170; g.vy=Math.sin(a)*170-40; g.face=a; g.t=0; }
      else if(Math.random()<dt*.3){ g.face+=rnd(-1,1); }
    }else if(g.state==='fly'){
      g.t+=dt; g.x+=g.vx*dt; g.y+=g.vy*dt; g.z=Math.min(60,g.z+dt*60);
      if(g.t>4){g.state='gone'; g.gone=rnd(10,25);}
    }else{ g.gone-=dt; if(g.gone<=0) newGull(g); }
  }
  for(const d of ducks){ d.a+=d.sp*dt; d.x=(LAKE.x+Math.cos(d.a)*LAKE.rx*d.r)*TS; d.y=(LAKE.y+Math.sin(d.a)*LAKE.ry*d.r)*TS; d.face=d.a+(d.sp>0?Math.PI/2:-Math.PI/2); }
}
function guardFor(zone){return guards.find(g=>g.zone===zone);}
function sees(n,mul){
  if(!P||P.hidden||G.mode!=='play'||S.inside) return false;
  const d=dist(n.x,n.y,P.x,P.y); const R=(darkAmt>.5?(n.torch?150:105):200)*(mul||1)*(P.sneak?.6:1);
  if(d>R) return false;
  const hear=P.sneak?0:(S.gear.sneakers?26:46); if(d<hear) return true;
  return Math.abs(angDiff(Math.atan2(P.y-n.y,P.x-n.x),n.face))<0.72;
}
function alertGuard(g,txt){
  if(!g||g.state==='chase') return;
  g.state='chase'; g.lostT=0; g.bubble={t:2.4,txt:txt||'Hey! Snack thief!'}; sfx('alert');
  toast('Run! '+g.name+' spotted you. Hide in a bush or get out of sight.','bad');
}
function grabSnack(pc){
  const id=pc.cooler.snacks.pop();
  if(!addItem(id)){pc.cooler.snacks.push(id); toast('Your bag is full.','bad'); return;}
  const g=guardFor(pc.zone); let seen=false;
  const asleep=pc.state==='sleep';
  if(g&&guardActive(g)&&g.state!=='chase'&&sees(g,1)) seen=true;
  for(const o of picnics){ if(o!==pc&&o.zone===pc.zone&&watching(o)&&sees(o.p,.62)) seen=true; }
  G.hot=6; G.hotZone=pc.zone;
  if(seen){ sfx('pick'); alertGuard(g); }
  else { sfx('sneak'); S.stats.grabs++; toast('Sneaky! You grabbed '+an(ITEMS[id].n.toLowerCase())+'.','good'); completeGoal('grab'); if(asleep) completeGoal('night'); }
}
function busted(g){
  if(G.busy) return;
  const lost=S.inv.filter(s=>ITEMS[s.id].k==='snack').reduce((a,s)=>a+s.n,0);
  S.inv=S.inv.filter(s=>ITEMS[s.id].k!=='snack');
  const fine=Math.min(10,S.money); S.money-=fine; S.stats.busted++; G.hot=0;
  g.state='return'; g.bubble={t:2.5,txt:'Gotcha!'}; sfx('fail');
  fadeDo(()=>{ P.x=g.exit[0]; P.y=g.exit[1]; S.mode='foot'; P.sneak=false; camSnap(); },()=>{
    toast(g.name+' caught you. '+(lost?'Your snacks were taken':'Nothing to take this time')+(fine?' and you paid a '+money(fine)+' fine.':'.'),'bad');
  });
}

  if(b.id==='farmhouse'){ if(hourIn(6,22)) enterBuilding(b); else { sfx('lock'); toast('The farmhouse is dark. Joan\u2019s fast asleep.'); } return; }
  if(b.house!=null){ const occ=houseOccupants(b.house); if(occ.length) enterBuilding(b); else { sfx('lock'); toast(awake()?'You knock, but nobody\u2019s home.':'The lights are off. Everyone\u2019s asleep.'); } return; }
  const st=staff.find(s=>s.def.job===b.id);
  if(st&&st.state==='work') enterBuilding(b);
  else if(st&&st.state==='toWork'&&shopOpen(b.id)){ sfx('lock'); toast(st.name+' is on the way to open up. Back in a moment!'); }
  else { sfx('lock'); toast(b.name+' is closed. Open '+fmtTime(b.hours[0]*60)+' to '+fmtTime(b.hours[1]*60)+'.'); }
}

const trafficOn=()=>hourIn(6.5,22.5)&&!G.race;
function updateTraffic(dt){
  if(!trafficOn()) return;
  for(const c of traffic){
    const R=ROUTES[c.r], fx=Math.cos(c.face), fy=Math.sin(c.face);
    let want=150, blockedByP=false;
    if(P&&G.mode==='play'&&!S.inside){ const dx=P.x-c.x, dy=P.y-c.y, f=dx*fx+dy*fy, l=Math.abs(-dx*fy+dy*fx); if(f>0&&f<130&&l<(S.mode==='car'?42:26)){ want=f<75?0:60; blockedByP=f<75; } }
    for(const o of traffic){ if(o===c||o.r!==c.r) continue; let ds=o.s-c.s; ds=((ds%R.L)+R.L)%R.L; if(ds<95){ want=Math.min(want,ds<60?0:70); } }
    c.v+=clamp(want-c.v,-260*dt,90*dt); c.s=(c.s+c.v*dt)%R.L; Object.assign(c,routePos(R,c.s));
    if(blockedByP){ c.blockT+=dt; c.honkT-=dt; if(c.blockT>1.4&&c.honkT<=0){ c.honkT=3.5; sfxAt('honk',c.x,c.y,500); } } else c.blockT=0;
  }
}
function trafficHit(x,y,r){ if(!trafficOn()) return false; for(const c of traffic){ const dx=x-c.x, dy=y-c.y; if(Math.abs(dx)>80||Math.abs(dy)>80) continue; const fx=Math.cos(c.face), fy=Math.sin(c.face); const f=dx*fx+dy*fy, l=-dx*fy+dy*fx; if(Math.abs(f)<36+r*.6&&Math.abs(l)<18+r*.6) return true; } return false; }

function racePts(rc){ return rc.pts.map(p=>[p[0]*TS,p[1]*TS]); }
function raceTotal(rc){ return rc.open?rc.pts.length-1:rc.laps*(rc.pts.length); }
function raceTarget(rc,k){ const n=rc.pts.length; return rc.open?Math.min(k+1,n-1):(k+1)%n; }
function raceProgress(rc,pts,k,x,y){ const tot=raceTotal(rc); if(k>=tot) return tot+1; const t=pts[raceTarget(rc,k)], f=pts[rc.open?k:k%pts.length]; const L=dist(f[0],f[1],t[0],t[1])||1; return k+clamp(1-dist(x,y,t[0],t[1])/L,0,1); }

function raceCPRadius(){ return 2.1*TS; }
function updateRace(dt){
  const R=G.race; if(!R) return;
  if(R.phase==='count'){ R.t-=dt; const n=Math.ceil(R.t-.6); if(n<R.lastBeep&&n>=1&&n<=3){ R.lastBeep=n; showRegion(String(n)); sfx('beep'); } if(R.t<=.6){ R.phase='go'; R.k=-1; showRegion('GO!'); sfx('go'); } return; }
  if(R.phase==='done'){ R.t-=dt; if(R.t<=0) G.race=null; return; }
  R.time+=dt; const rc=R.rc, pts=R.pts, tot=raceTotal(rc);
  // player progress: k=-1 means heading for the start line
  const tgtIdx=R.k<0?0:raceTarget(rc,R.k), tp=pts[tgtIdx];
  if(dist(P.x,P.y,tp[0],tp[1])<raceCPRadius()){ R.k++; if(R.k>0) sfx('checkpoint'); if(R.k>=tot){ finishRace(); return; } if(!rc.open&&R.k>0&&R.k%pts.length===0) toast('Lap '+(Math.floor(R.k/pts.length)+1)+' of '+rc.laps); }

    if(r.done) continue;
    const ti=r.k<0?0:raceTarget(rc,r.k), t=pts[ti]; const dx=t[0]-r.x, dy=t[1]-r.y, d=Math.hypot(dx,dy);

    else { r.x+=Math.cos(r.face)*step; r.y+=Math.sin(r.face)*step; }
  }
  if(R.time>240){ toast('Time\u2019s up. The marshals waved the race off.'); R.phase='done'; R.t=1; sfx('lose'); }
}
function racePlace(){ const R=G.race; if(!R) return 0; const me=raceProgress(R.rc,R.pts,Math.max(R.k,0),P.x,P.y); let place=1+R.order.length; for(const r of R.racers){ if(r.done) continue; if(raceProgress(R.rc,R.pts,Math.max(r.k,0),r.x,r.y)>me) place++; } return place; }

function updatePlayer(dt){
  let ix=0,iy=0;
  if(keys.has('ArrowLeft')||keys.has('KeyA')) ix-=1;
  if(keys.has('ArrowRight')||keys.has('KeyD')) ix+=1;
  if(keys.has('ArrowUp')||keys.has('KeyW')) iy-=1;
  if(keys.has('ArrowDown')||keys.has('KeyS')) iy+=1;
  ix+=input.stick.x; iy+=input.stick.y;
  if(G.race&&G.race.phase==='count'){ix=0;iy=0;}
  let m=Math.hypot(ix,iy); if(m>1){ix/=m;iy/=m;m=1;}
  { const cy=Math.cos(camYaw), sy=Math.sin(camYaw); const wx=cy*ix+sy*iy, wy=-sy*ix+cy*iy; ix=wx; iy=wy; }
  const inside=!!S.inside;

  const running=(keys.has('ShiftLeft')||keys.has('ShiftRight')||input.run)&&S.mode==='foot'&&!P.sneak;
  P.hidden=null;
  if(G.fish&&m>.25) cancelFish('You reeled in your line.');

  const tile=inside?T.PIER:tPx(P.x,P.y);
  let spd=125;
  if(S.mode==='scooter') spd=245;
  else if(S.mode==='car'){ const cd=carDef(S.carModel); spd=cd.spd*((!cd.off&&(tile===T.GRASS||tile===T.DARK||tile===T.SAND||tile===T.FIELD))?.72:1); }
  else if(S.mode==='boat') spd=180; else if(P.swim) spd=72; else if(P.sneak) spd=68; else if(running) spd=S.gear.sneakers?232:198;
  if(S.mode!=='car'){ if(S.food<=0) spd*=.8; if(S.energy<15) spd*=.8; }
  P.running=running&&m>.1&&!P.swim;
  const ox=P.x, oy=P.y;
  if(m>.05){
    const veh=S.mode==='boat'||S.mode==='car';
    const mode=S.mode==='boat'?'boat':(S.mode==='scooter'||S.mode==='car')?'scooter':'foot';
    const r=S.mode==='boat'?18:S.mode==='car'?20:10;

}
function regionAt(x,y){
  if(isleE(x,y)<2.2) return 'Gull Island';
  if(lakeE(x,y)<2.2) return 'Lilypad Lake';
  if(campE(x,y)<1.7) return 'Pinewood Campground';
  if(x>64&&y>30&&y<45) return 'Clover Farm';
  if(x>45&&x<51&&y>43.5) return 'Old Pier';
  if(tAt(Math.floor(x),Math.floor(y))===T.DEEP) return 'Open sea';
  if(y>southCoast(x)-4.2&&x<64) return 'Sunny Strand';
  if(y<17.5) return 'Whispering Woods';
  return 'Pebble Cove';
}

/* ================= fishing ================= */
function fishTarget(){
  const fx=P.x+Math.cos(P.face)*(S.mode==='boat'?44:34), fy=P.y+Math.sin(P.face)*(S.mode==='boat'?44:34);
  const t=tPx(fx,fy);
  if(t!==T.WATER&&t!==T.DEEP) return null;
  if(S.mode!=='boat'&&(P.swim||S.mode==='scooter'||S.mode==='car')) return null;
  return {x:fx,y:fy,tx:Math.floor(fx/TS),ty:Math.floor(fy/TS)};
}
function pickFish(tx,ty){
  const reg=wreg[I(tx,ty)], deep=map[I(tx,ty)]===T.DEEP;
  let tb;
  if(dist(tx,ty,ISLE.x,ISLE.y)<11) tb=[['lobster',20],['snapper',28],['tuna',16],['pearl',8],['sardine',16],['boot',8]];
  else if(reg===2) tb=[['bass',45],['trout',34],['koi',2+S.rod*3],['boot',14]];
  else if(reg===3) tb=[['trout',55],['bass',30],['boot',15]];
  else if(deep&&S.mode==='boat') tb=[['tuna',26],['salmon',30],['snapper',24],['sardine',12],['boot',6]];
  else tb=[['sardine',45],['snapper',22],['salmon',14],['boot',16]];
  return wpick(tb);
}
function startFish(ft){
  G.fish={phase:'wait',t:rnd(2.2,5.5)/(1+.4*(S.rod-1)),bx:ft.x,by:ft.y,tx:ft.tx,ty:ft.ty};
  sfx('cast'); setPrompt(null);
}
function cancelFish(msg){ if(!G.fish) return; G.fish=null; $('#reel').classList.add('hidden'); if(msg) toast(msg); }
function fishAction(){
  const f=G.fish; if(!f) return;
  if(f.phase==='wait'){ cancelFish('Too early. The fish swam off.'); sfx('fail'); }
  else if(f.phase==='bite'){
    const id=pickFish(f.tx,f.ty), it=ITEMS[id];
    f.phase='reel'; f.id=id; f.pos=0; f.dir=1; f.t=6;
    f.w=clamp(it.w*(1+.28*(S.rod-1)),.08,.5); f.z=rnd(.1,.9-f.w); f.spd=.75+(1-it.w*2.5)*.9;
    $('#reelZone').style.left=(f.z*100)+'%'; $('#reelZone').style.width=(f.w*100)+'%';
    $('#reelMsg').textContent=isTouch()?'Tap Use when the marker is in the green':'Press E when the marker is in the green';
    $('#reel').classList.remove('hidden');
  }
  else if(f.phase==='reel'){
    $('#reel').classList.add('hidden');
    if(f.pos>=f.z&&f.pos<=f.z+f.w){
      const it=ITEMS[f.id]; G.fish=null;
      if(addItem(f.id)){
        sfx('catch'); S.stats.fish++;
        toast(f.id==='boot'?'You fished up a soggy boot. Lovely.':'You caught '+an(it.n.toLowerCase())+'! Worth about '+money(it.p)+'.','good');
        if(it.k==='fish'&&S.mode!=='boat') completeGoal('fish1');
        if(f.id==='koi') completeGoal('koi');
      } else toast('Your bag is full, so you let the '+it.n.toLowerCase()+' go.','bad');
    } else { G.fish=null; sfx('fail'); toast('It got away!'); }
  }
}
function updateFish(dt){
  const f=G.fish; if(!f) return;
  if(f.phase==='wait'){ f.t-=dt; if(f.t<=0){f.phase='bite'; f.t=1.25; sfx('bite');} }
  else if(f.phase==='bite'){ f.t-=dt; if(f.t<=0){ cancelFish('Too slow. Something nibbled your bait and left.'); } }
  else if(f.phase==='reel'){
    f.pos+=f.dir*f.spd*dt; if(f.pos>1){f.pos=1;f.dir=-1;} if(f.pos<0){f.pos=0;f.dir=1;}
    $('#reelMark').style.left=(f.pos*100)+'%';
    f.t-=dt; if(f.t<=0){ $('#reel').classList.add('hidden'); G.fish=null; toast('The line went slack. It got away.'); }
  }
}

/* ================= interactions ================= */
function nearestInteract(){
  if(!P||G.race) return null;
  if(G.fish) return {label:G.fish.phase==='wait'?'Waiting for a bite\u2026':G.fish.phase==='bite'?'Hook it!':'Reel in!',act:fishAction,fishing:true};
  let best=null,bd=1e9;
  const c=(x,y,r,label,act)=>{const d=dist(P.x,P.y,x,y); if(d<r&&d<bd){bd=d;best={label,act};}};
  if(S.inside){
    const R=ROOMS[S.inside];
    c(R.ox+R.w*TS/2,R.oz+R.d*TS-12,48,'Go outside',()=>leaveBuilding());
    for(const it of R.items){
      const x=R.ox+it.x*TS, y=R.oz+it.z*TS, rr=Math.max(it.w||.6,it.d||.6)*TS/2+36;
      if(it.act==='sleep') c(x,y,rr,'Go to sleep',trySleep);
      else if(it.act==='cook') c(x,y,rr,'Cook on the stove',()=>ui.open('cook'));
      else if(it.act==='wardrobe') c(x,y,rr,'Open the wardrobe',()=>ui.open('home'));
      else if(it.act==='donuts'&&!isTaken('donuts')) c(x,y,rr,'Swipe a donut',swipeDonut);
      else if(it.act==='staff'){ const st=staff.find(q=>q.def.job===S.inside&&q.state==='work'); if(st) c(x,y,rr+24,'Talk to '+st.name,()=>{ st.bubble={t:2.2,txt:pick(['What can I get you?','How can I help?','Take a look around!'])}; sfx('ui'); ui.open(S.inside==='motors'?'dealer':S.inside); }); }
      else if(it.t==='car') c(x,y,74,'Look at the '+carDef(it.model).n,()=>ui.open('dealer'));
    }
    if(R.house!=null) for(const p of houseOccupants(R.house)) c(p.x,p.y,58,'Chat with '+p.name,()=>ui.open('house',p));
    if(S.inside==='farmhouse'&&hourIn(18,22)){ const f=ROOMS.farmhouse; c(f.ox+5.4*TS,f.oz+2.2*TS,62,'Talk to Farmer Joan',()=>ui.open('farm')); }
    return best;
  }
  if(S.mode==='boat'){
    const land=findShore(); if(land) c(P.x,P.y,10,'Go ashore',()=>goAshore(land));
  } else if(S.mode==='car'){
    c(P.x,P.y,10,'Get out of the car',exitCar);
  } else {
    for(const b of BUILD){
      const dx=b.door[0]*TS, dy=b.door[1]*TS+18;
      if(b.house!=null&&S.delivery&&S.delivery.house===b.house) c(dx,dy,52,'Deliver the parcel',deliverParcel);
      else c(dx,dy,46,b.id==='home'?'Go inside':b.house!=null?'Knock on the door':'Go into '+b.name,()=>tryEnter(b));
    }
    if(hourIn(7,18)) c(farmer.x,farmer.y,56,'Talk to Farmer Joan',()=>openShopLike('farm'));
    for(const pc of picnics){ if(grabbable(pc)) c(pc.cooler.x,pc.cooler.y,42,'Grab a snack',()=>grabSnack(pc)); }
    for(const tc of trashCans) if(!isTaken(tc.id)) c(tc.x,tc.y,40,'Dig through the trash',()=>rummage(tc));
    if(S.carModel&&S.car&&S.mode==='foot') c(S.car.x,S.car.y,66,'Get in your car',enterCar);
    if(hasKind('fish')) c(campfire.x,campfire.y,64,'Cook at the campfire',()=>openShopLike('cook'));
    for(const b of berryBushes) if(!isTaken('b'+b.id)) c(b.x,b.y-6,40,'Pick berries',()=>{ if(addItem('berries')){take('b'+b.id); sfx('pick'); toast('You picked some wild berries.');} else toast('Your bag is full.','bad'); });
    for(const f of forage) if(!isTaken(f.id)) c(f.x,f.y,34,f.kind==='shell'?'Pick up the shell':'Pick the mushroom',()=>{ if(addItem(f.kind)){take(f.id); sfx('pick');} else toast('Your bag is full.','bad'); });
    if(S.farm.active) S.farm.carrots.forEach(cr=>{ if(!cr.got) c(cr.x,cr.y,34,'Pull the carrot',()=>{cr.got=1; sfx('pick'); const n=S.farm.carrots.filter(z=>z.got).length; toast(n>=S.farm.carrots.length?'That\u2019s all of them. Take them to Farmer Joan.':'Carrots: '+n+' of '+S.farm.carrots.length);}); });
    if(S.gear.boat&&S.mode==='foot') c(S.boat.x,S.boat.y,62,'Get in the rowboat',boardBoat);
    if(!S.chest) c(chestObj.x,chestObj.y,52,'Open the old chest',openChest);
  }
  if(!best){ const ft=fishTarget(); if(ft) best={label:'Cast your line',act:()=>startFish(ft)}; }
  return best;
}
function canSleep(){ return clock()>=18*60||clock()<5*60||S.time>=1440||S.energy<40; }
function trySleep(){ if(canSleep()){ sleepNow(false); } else toast('You\u2019re not sleepy yet. Come back after 6pm or when your energy is low.'); }
function swipeDonut(){ if(!addItem('donut')){ toast('Your bag is full.','bad'); return; } take('donuts'); sfx('sneak'); toast('You swiped a donut from the warden\u2019s box. He\u2019ll never notice. Probably.','good'); }
function doAction(){
  if(G.mode!=='play'||ui.stack.length||G.busy) return;
  const it=G.fish?{act:fishAction}:nearestInteract();
  if(it&&it.act) it.act();
}
function findShore(){
  let best=null,bd=1e9;
  for(let a=0;a<16;a++)for(const r of [30,50,70]){
    const x=P.x+Math.cos(a/16*TAU)*r,y=P.y+Math.sin(a/16*TAU)*r,t=tPx(x,y);
    if(t!==T.WATER&&t!==T.DEEP&&!collides(x,y,10,'foot')){const d=r; if(d<bd){bd=d;best={x,y};}}
  }
  return best;
}
function rummage(tc){
  take(tc.id); sfx('trash');
  const r=wpick([['chips',22],['apple',14],['donut',10],['hotdog',10],['coin',20],['boot',16],['shell',6],['nothing',12]]);
  if(r==='nothing') toast('Just old napkins in here.');
  else if(r==='coin'){ const n=2+Math.floor(Math.random()*7); earn(n); toast('You found '+money(n)+' under a pizza box.','good'); completeGoal('trash'); }
  else if(addItem(r)){ toast(r==='boot'?'Someone threw out a perfectly good boot.':'You found '+an(ITEMS[r].n.toLowerCase())+' in the trash. Still good!','good'); if(r!=='boot') completeGoal('trash'); }
  else toast('Your bag is full.','bad');
  if(tc.camp){ G.hot=Math.max(G.hot,3); G.hotZone='camp'; const g=guardFor('camp'); if(g&&g.state!=='chase'&&!P.sneak&&dist(g.x,g.y,P.x,P.y)<230&&!P.hidden) alertGuard(g,'Stay out of the bins!'); }
}
function enterCar(){ S.mode='car'; P.x=S.car.x; P.y=S.car.y; P.face=S.car.face; P.sneak=false; cancelFish(); sfx('door'); engineStart(S.carModel); if(!G.carTip){G.carTip=1; toast('Drive with the arrow keys or the stick. H honks, E gets you out.');} }
function exitCar(){
  if(G.race){ toast('Finish the race first, or leave it from the pause menu.'); return; }
  for(const a of [Math.PI/2,-Math.PI/2,Math.PI,0]){ const ang=P.face+a; const x=P.x+Math.cos(ang)*38,y=P.y+Math.sin(ang)*38; if(!collides(x,y,10,'foot')&&tPx(x,y)!==T.WATER){ S.car={x:P.x,y:P.y,face:P.face}; S.mode='foot'; P.x=x; P.y=y; sfx('door'); engineStop(); return; } }
  toast('There\u2019s no room to get out here.');
}
function toggleSneak(){
  if(G.mode!=='play'||ui.stack.length) return;
  if(S.mode!=='foot'||P.swim){ toast('You can only sneak on foot.'); return; }
  if(G.race) return;
  P.sneak=!P.sneak; sfx('ui');
}
function goAshore(land){ S.boat.x=P.x; S.boat.y=P.y; S.boat.face=P.face; S.mode='foot'; P.x=land.x; P.y=land.y; sfx('splash'); }
function boardBoat(){ S.mode='boat'; P.x=S.boat.x; P.y=S.boat.y; P.face=S.boat.face; sfx('splash'); if(!G.boatTip){G.boatTip=1; toast('Row with the arrow keys or the stick. Get close to land to go ashore.');} }
function toggleScooter(){
  if(G.mode!=='play'||ui.stack.length) return;
  if(!S.gear.scooter){ toast('You don\u2019t own a scooter yet. Cove Supply sells them.'); return; }
  if(S.mode==='scooter'){S.mode='foot'; engineStop(); return;}
  if(S.mode==='boat'){ toast('Go ashore first.'); return; }
  if(S.mode==='car'){ exitCar(); return; }
  if(P.swim){ toast('Get out of the water first.'); return; }
  if(S.inside){ toast('Not indoors!'); return; }
  cancelFish(); P.sneak=false; S.mode='scooter'; sfx('ui'); engineStart('scooter');
}
function openChest(){
  S.chest=true; earn(150); sfx('chest'); setTimeout(()=>sfx('catch'),400);
  const got=addItem('pearl');
  toast('Inside: an old coin pouch with '+money(150)+(got?' and a shiny pearl!':'. There was a pearl too, but your bag is full.'),'good');
  completeGoal('chest');
}
function deliverParcel(){
  const d=S.delivery; if(!d) return;
  const early=S.time<=d.due; const pay=early?Math.round(d.pay*1.5):d.pay;
  earn(pay); S.delivery=null; S.stats.deliveries++; sfx('register'); ui.closeAll();
  toast((early?'Right on time! ':'Delivered. ')+HOUSES[d.house].who+' paid you '+money(pay)+'.','good'); completeGoal('deliver');
}
function startDelivery(){
  const opts=HOUSES.map((h,i)=>i).filter(i=>i!==G.lastHouse);
  const i=pick(opts); G.lastHouse=i; const h=HOUSES[i];
  const dd=dist(49.5,27,h.x+2,h.y+3);
  S.delivery={house:i,pay:10+Math.round(dd*.65),due:S.time+Math.round(dd*1.1+18)};
  toast('Parcel for '+h.who+'. Follow the arrow.','good'); sfx('pick');
}
function startFarm(){
  const R=mulberry(S.day*31+7); const cs=[];
  while(cs.length<6){const x=66.5+Math.floor(R()*19),y=36.5+Math.floor(R()*6); if(cs.some(c=>c.x===x*TS&&c.y===y*TS)) continue; cs.push({x:x*TS,y:y*TS,got:0});}
  S.farm={day:S.day,active:true,carrots:cs};
}
function passOut(msg){ sleepNow(true,msg); }
function sleepNow(out,msg){
  G.busy=true; cancelFish(); engineStop(); if(G.race) G.race=null; ui.closeAll(); sfx('sleep');
  fadeDo(()=>{
    S.day++; S.time=(out?9:7)*60; S.energy=out?70:100; S.food=Math.max(8,S.food-(out?35:22));
    S.taken={}; if(S.delivery){S.delivery=null;} if(S.farm.active&&S.farm.day<S.day) S.farm.active=false;
    if(out){ const fine=Math.min(5,S.money); S.money-=fine; }
    if(S.mode==='car'&&S.car){ S.car={x:P.x,y:P.y,face:P.face}; }
    S.mode='foot'; P.sneak=false;
    const R=ROOMS.home; S.inside='home'; P.x=R.ox+3.1*TS; P.y=R.oz+1.8*TS; P.face=Math.PI/2; camYaw=0;
    genForage(); picnics.forEach(pc=>{pc.state='sit';pc.timer=rnd(4,20);pc.p.x=pc.bx;pc.p.y=pc.by;refill(pc);});
    guards.forEach(g=>{g.state='patrol';g.x=g.patrol[0][0];g.y=g.patrol[0][1];g.pi=0;});
    setupPeople(); setupTraffic();
    camSnap(); saveGame(true);
  },()=>{ G.busy=false; toast(out?msg:'Good morning! Day '+S.day+'. Your game was saved.','good'); showRegion('Day '+S.day); });
}
function sellAll(){
  let total=0;
  for(let i=S.inv.length-1;i>=0;i--){const s=S.inv[i],it=ITEMS[s.id]; if(it.p&&it.k!=='meal'&&it.k!=='snack'){total+=it.p*s.n; S.inv.splice(i,1);} }
  if(total>0){earn(total); sfx('register'); completeGoal('sell'); toast('Sold everything for '+money(total)+'.','good');}
}
/* ================= HUD, toasts, fades ================= */
function toast(msg,kind){
  const el=document.createElement('div'); el.className='toast'+(kind?' '+kind:''); el.textContent=msg;
  const box=$('#toasts'); box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out'); setTimeout(()=>el.remove(),450);},3600);
}
let regionTimer=0;
function showRegion(name){const r=$('#region'); r.textContent=name; r.classList.add('on'); clearTimeout(regionTimer); regionTimer=setTimeout(()=>r.classList.remove('on'),1900);}
function fadeDo(mid,after){ G.busy=true; const f=$('#fade'); f.classList.add('on'); setTimeout(()=>{ try{mid&&mid();}catch(e){console.error(e);} setTimeout(()=>{f.classList.remove('on'); G.busy=false; after&&after();},250); },480); }
const hudCache={};
function setText(id,v){ if(hudCache[id]!==v){hudCache[id]=v; $(id).textContent=v;} }
function updateHUD(force){
  if(!S) return;
  if(force) for(const k in hudCache) delete hudCache[k];
  setText('#moneyT',money(S.money)); setText('#clockT',fmtTime(clock())); setText('#dayT','Day '+S.day);
  const fw=Math.round(S.food), ew=Math.round(S.energy);
  if(hudCache.f!==fw){hudCache.f=fw; $('#mFood i').style.width=fw+'%'; $('#mFood').classList.toggle('low',fw<20);}
  if(hudCache.e!==ew){hudCache.e=ew; $('#mEnergy i').style.width=ew+'%'; $('#mEnergy').classList.toggle('low',ew<20);}
  const g=GOALS.find(x=>!S.goals[x[0]]);
  const gt=g?'Next: '+g[1]:'Every goal done. Pebble Cove is yours.';
  setText('#goalChip',gt);
  let job='';
  if(G.race){ const R=G.race, rc=R.rc; const lap=rc.open?'':'Lap '+Math.min(rc.laps,Math.floor(Math.max(R.k,0)/rc.pts.length)+1)+' of '+rc.laps+'   '; job=R.phase==='count'?rc.n+': get ready':lap+['1st','2nd','3rd','4th'][racePlace()-1]+' place   '+fmtRaceTime(R.time); }
  else if(S.delivery){const h=HOUSES[S.delivery.house]; job='Parcel for '+h.who+(S.time<=S.delivery.due?', bonus until '+fmtTime(S.delivery.due):'');}
  else if(S.farm.active){const n=S.farm.carrots.filter(c=>c.got).length; job=n>=S.farm.carrots.length?'Bring the carrots to Farmer Joan':'Carrots pulled: '+n+' of '+S.farm.carrots.length;}
  if(hudCache.job!==job){hudCache.job=job; $('#jobChip').textContent=job; $('#jobChip').classList.toggle('hidden',!job);}
  $('#tRide').classList.toggle('hidden',!S.gear.scooter||S.mode==='boat'||S.mode==='car');
  if(hudCache.ride!==S.mode){hudCache.ride=S.mode; $('#tRide').textContent=S.mode==='scooter'?'Walk':'Ride';}
  const sn=P&&P.sneak?'Stand':'Sneak'; if(hudCache.sn!==sn){hudCache.sn=sn; $('#tSneak').textContent=sn;}
  $('#tSneak').classList.toggle('hidden',S.mode!=='foot');
}
function setPrompt(it){
  const label=it?it.label:'';
  if(G.lastPrompt===label) return; G.lastPrompt=label;
  const p=$('#prompt');
  if(!label||isTouch()){ p.classList.add('hidden'); }
  else { p.innerHTML='<kbd>E</kbd> '+esc(label); p.classList.remove('hidden'); }
  $('#tAct').textContent=it?shortLabel(label):'Use';
}
function shortLabel(l){ if(l.startsWith('Talk to')||l.startsWith('Chat with')) return 'Talk'; if(l.startsWith('Go into')||l==='Knock on the door') return 'Enter'; if(l.startsWith('Look at')) return 'Look'; const m={'Go outside':'Exit','Go to sleep':'Sleep','Cook on the stove':'Cook','Open the wardrobe':'Clothes','Swipe a donut':'Swipe','Get in your car':'Drive','Get out of the car':'Get out','Dig through the trash':'Dig','Get in the truck':'Drive','Get out of the truck':'Get out','Cast your line':'Fish','Grab a snack':'Grab','Go inside':'Enter','Get in the rowboat':'Board','Go ashore':'Ashore','Hook it!':'Hook!','Reel in!':'Reel!','Waiting for a bite\u2026':'Wait\u2026'}; if(m[l]) return m[l]; const w=l.split(' '); return w.length>2?w[0]:l; }

/* ================= modal UI ================= */
const ui={stack:[],
  open(name,arg){ this.stack.push([name,arg]); this.render(); sfx('ui'); },
  replace(name,arg){ this.stack[this.stack.length-1]=[name,arg]; this.render(); },
  back(){ this.stack.pop(); if(this.stack.length) this.render(); else this.hide(); },
  closeAll(){ this.stack=[]; this.hide(); },
  hide(){ $('#modal').classList.remove('show'); if(G.mode==='play') keys.clear(); },
  refresh(){ if(this.stack.length) this.render(); },
  render(){
    const [name,arg]=this.stack[this.stack.length-1];
    const sc=SCREENS[name](arg);
    const sh=$('#sheet'); sh.className='sheet'+(sc.wide?' wide':'');
    const closeLbl=this.stack.length>1?'Back':'Close';
    sh.innerHTML='<div class="head"><h2>'+esc(sc.title)+'</h2>'+(sc.noClose?'':'<button class="btn alt small close" data-act="__back">'+closeLbl+'</button>')+'</div>'+(sc.lead?'<p class="lead">'+sc.lead+'</p>':'')+sc.html;
    sh._acts=sc.acts||{};
    $('#modal').classList.add('show');
    if(sc.mount) sc.mount(sh);
    const f=sh.querySelector('[autofocus]')||sh.querySelector('.btn:not(.close)');
    if(f&&!isTouch()) f.focus({preventScroll:true});
  }
};
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act; if(a==='__back'){ui.back(); return;}
  const fn=$('#sheet')._acts[a]; if(fn){ fn(b.dataset); }
});
$('#modal').addEventListener('pointerdown',e=>{ if(e.target.id==='modal'&&G.mode==='play') ui.closeAll(); });
const em=(id)=>'<div class="em" style="background:'+ITEMS[id].c+'">'+ITEMS[id].e+'</div>';
const gem=(e,c)=>'<div class="em" style="background:'+(c||'#f4e3c0')+'">'+e+'</div>';
function slotInfo(n){const d=slotData(n); if(!d) return null; return {name:d.name,day:d.day,money:d.money,when:new Date(d.savedAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),goals:Object.keys(d.goals||{}).length};}
let newLook=null, newSlot=1, delArm=0;

const SCREENS={
  pause(){ return {title:'Paused',noClose:true,html:'<div class="stack">'+
      '<button class="btn" data-act="resume">Resume</button>'+(G.race?'<button class="btn red" data-act="leaverace">Leave the race</button>':'')+

  how(){ return {title:'How to play',html:'<div class="howto">'+

    '<p><b>Use</b> things with <kbd>E</kbd> or <kbd>Space</kbd>: doors, people, coolers, bins, fishing spots, your boat and car. <kbd>R</kbd> rides your scooter, <kbd>H</kbd> honks, <kbd>I</kbd> opens your bag, <kbd>M</kbd> the map, <kbd>Esc</kbd> pauses.</p>'+

  if(!bobber){ bobber=new THREE.Group(); mk(G3.sph,LM('#ef5f52'),0,.05,0,bobber).scale.setScalar(.08); mk(G3.sph,LM('#fffaf0'),0,-.02,0,bobber).scale.setScalar(.07); scene.add(bobber);
    line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.7})); line.frustumCulled=false; scene.add(line); }
  bobber.visible=line.visible=!!(play&&G.fish);
  if(bobber.visible){ const f=G.fish; const b=f.phase==='bite'?Math.sin(now/50)*.06-.04:Math.sin(now/400)*.02; bobber.position.set(f.bx*U,b,f.by*U);
    const la=line.geometry.attributes.position.array; const tipY=groundY(P.x,P.y)+(S.mode==='boat'?1.1:1.55); la[0]=P.x*U+Math.cos(P.face)*1.0; la[1]=tipY; la[2]=P.y*U+Math.sin(P.face)*1.0; la[3]=f.bx*U; la[4]=b+.05; la[5]=f.by*U; line.geometry.attributes.position.needsUpdate=true;
    if(f.phase!=='wait') label('bob',f.bx*U,.6,f.by*U,'!','yel'); }
  // lamps: nearest three get real lights
  if((lampCheck-=1)<=0){ lampCheck=30; const sorted=lampPos.slice().sort((a,b)=>a.distanceToSquared(camT)-b.distanceToSquared(camT)); lampLights.forEach((l,i)=>{ if(sorted[i]) l.position.copy(sorted[i]); }); }
  if(play&&!inRoom){ playerLight.position.set(P.x*U,groundY(P.x,P.y)+1.6,P.y*U); }
  if(inRoom){ const Rm=ROOMS[S.inside]; iLamp.position.set(Rm.ox*U+Rm.w/2,2.2,Rm.d/2); iLamp.intensity=.45+darkAmt*.5; iHemi.intensity=.95-darkAmt*.3; iSun.position.set(Rm.ox*U+Rm.w/2+3,10,6); iSun.target.position.set(Rm.ox*U+Rm.w/2,0,Rm.d/2); iSun.target.updateMatrixWorld(); }
  // sun follows the camera target
  sun.position.set(camT.x+9,camT.y+18,camT.z+7); sun.target.position.copy(camT); sun.target.updateMatrixWorld();
  // job marker & edge arrow
  const t=play?jobTarget():null; jobMarker.visible=!!t; const ea=$('#edgeArrow');
  if(t){ const ty=groundY(t.x,t.y); jobMarker.position.set(t.x*U,ty+2.3+Math.sin(now/220)*.18,t.y*U); jobMarker.rotation.y=now/600;
    tmpV.set(t.x*U,ty+1,t.y*U).project(camera); const on=tmpV.z<1&&Math.abs(tmpV.x)<.92&&Math.abs(tmpV.y)<.88;
    if(on) ea.classList.add('hidden'); else { let x=tmpV.x,y=tmpV.y; if(tmpV.z>1){x=-x;y=-y;} const a=Math.atan2(-y,x); const m=Math.max(Math.abs(x)/.88,Math.abs(y)/.8); x/=m; y/=m; ea.style.transform='translate('+((x+1)/2*vw).toFixed(1)+'px,'+((1-y)/2*vh).toFixed(1)+'px) rotate('+a.toFixed(3)+'rad)'; ea.classList.remove('hidden'); } }
  else ea.classList.add('hidden');
}

/* ================= input ================= */
function isTouch(){ return settings.touch==='on'||(settings.touch==='auto'&&(('ontouchstart' in window)||navigator.maxTouchPoints>0)&&matchMedia('(pointer: coarse)').matches); }
function applyTouch(){ $('#touch').classList.toggle('hidden',!(isTouch()&&G.mode==='play')); G.lastPrompt='__'; }
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  const c=e.code;
  if(c==='Escape'){ e.preventDefault(); if(ui.stack.length){ ui.back(); } else if(G.mode==='play'&&!G.busy){ cancelFish(); ui.open('pause'); } return; }
  if(G.mode!=='play'||ui.stack.length) return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(c)) e.preventDefault();
  if(e.repeat&&(c==='KeyE'||c==='Space'||c==='Enter'||c==='KeyC')) return;
  keys.add(c);
  if(c==='KeyE'||c==='Space'||c==='Enter') doAction();
  else if(c==='KeyR') toggleScooter();
  else if(c==='KeyC'||c==='ControlLeft') toggleSneak();
  else if(c==='KeyI'||c==='Tab'||c==='KeyB') ui.open('bag',null);
  else if(c==='KeyM') ui.open('map');
  else if(c==='KeyH'&&S&&S.mode==='car') sfx('horn');
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear(); input.run=false;});
(()=>{ // mouse camera drag + wheel zoom
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') return; drag={x:e.clientX}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',e=>{ if(!drag) return; if(!(S&&S.inside)) camYaw-=(e.clientX-drag.x)*.008; drag.x=e.clientX; });
  const end=()=>{drag=null;}; canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); camZoom=clamp(camZoom*(e.deltaY>0?1.08:.93),.6,1.7); },{passive:false});
  const lz=$('#lookZone'); let lid=null,lx=0;
  lz.addEventListener('pointerdown',e=>{ if(lid!==null) return; lid=e.pointerId; lx=e.clientX; lz.setPointerCapture(lid); e.preventDefault(); });
  lz.addEventListener('pointermove',e=>{ if(e.pointerId!==lid) return; if(!(S&&S.inside)) camYaw-=(e.clientX-lx)*.01; lx=e.clientX; });
  const le=e=>{ if(e.pointerId===lid) lid=null; }; lz.addEventListener('pointerup',le); lz.addEventListener('pointercancel',le);
})();
(()=>{ // joystick & buttons
  const z=$('#stickZone'), base=$('#stickBase'), knob=$('#stickKnob'); let id=null,ox=0,oy=0;
  z.addEventListener('pointerdown',e=>{ if(id!==null) return; id=e.pointerId; z.setPointerCapture(id); ox=e.clientX; oy=e.clientY; const r=z.getBoundingClientRect(); base.style.left=(ox-r.left)+'px'; base.style.top=(oy-r.top)+'px'; base.style.display='block'; knob.style.transform=''; e.preventDefault(); });
  z.addEventListener('pointermove',e=>{ if(e.pointerId!==id) return; let dx=e.clientX-ox,dy=e.clientY-oy; const d=Math.hypot(dx,dy),mx=50; if(d>mx){dx=dx/d*mx;dy=dy/d*mx;} knob.style.transform='translate('+dx+'px,'+dy+'px)'; const m=d<6?0:Math.min(1,d/mx*1.15); const n=Math.hypot(dx,dy)||1; input.stick.x=dx/n*m; input.stick.y=dy/n*m; });
  const end=e=>{ if(e.pointerId!==id) return; id=null; input.stick.x=input.stick.y=0; base.style.display='none'; };
  z.addEventListener('pointerup',end); z.addEventListener('pointercancel',end);
  const run=$('#tRun');
  run.addEventListener('pointerdown',e=>{input.run=true; run.classList.add('down'); e.preventDefault();});
  const ru=()=>{input.run=false; run.classList.remove('down');};
  run.addEventListener('pointerup',ru); run.addEventListener('pointercancel',ru); run.addEventListener('pointerleave',ru);
  $('#tAct').addEventListener('pointerdown',e=>{e.preventDefault(); doAction();});
  $('#tRide').addEventListener('pointerdown',e=>{e.preventDefault(); toggleScooter();});
  $('#tSneak').addEventListener('pointerdown',e=>{e.preventDefault(); toggleSneak();});
  $('#reelBar').addEventListener('pointerdown',e=>{e.preventDefault(); if(G.fish&&G.fish.phase==='reel') fishAction();});
})();
$('#bBag').addEventListener('click',()=>{ if(G.mode==='play'&&!G.busy) ui.open('bag',null); });
$('#bMap').addEventListener('click',()=>{ if(G.mode==='play'&&!G.busy) ui.open('map'); });
$('#bPause').addEventListener('click',()=>{ if(G.mode==='play'&&!G.busy){ cancelFish(); ui.open('pause'); } });

/* ================= game flow ================= */
function saveGame(silent){
  if(!S) return;
  S.x=P.x; S.y=P.y; S.face=P.face; S.savedAt=Date.now();
  const d=JSON.parse(JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v));
  if(S.inside){ const b=BUILD.find(x=>x.id===S.inside); if(b){ d.x=b.door[0]*TS; d.y=(b.door[1]+.7)*TS; d.face=Math.PI/2; } d.inside=null; d.mode='foot'; }
  if(saveJSON(SK+'slot'+S.slot,d)){ saveJSON(SK+'last',S.slot); Cloud.push(S.slot,d); if(!silent) toast('Saved to slot '+S.slot+'.','good'); }
  else toast('Couldn\u2019t save: this browser is blocking storage.','bad');
  updateTitleButtons();
}
function startGame(data,fresh){
  const base=newState({name:data.name,look:data.look||{shirt:SHIRTS[0],hair:HAIRS[0],skin:SKINS[0]},slot:data.slot||1});
  S=Object.assign(base,data); S.stats=Object.assign(base.stats,data.stats||{}); S.gear=data.gear||{}; S.goals=data.goals||{}; S.farm=Object.assign({day:0,active:false,carrots:[]},data.farm||{}); S.taken=data.taken||{}; S.boat=data.boat||base.boat;
  S.cars=data.cars||{}; S.races=data.races||{}; S.inside=null;
  if(S.gear.truck){ S.cars.pickup=true; if(!S.carModel) S.carModel='pickup'; delete S.gear.truck; }
  if(S.goals.truck){ S.goals.car=true; delete S.goals.truck; }
  if(S.carModel&&!S.car) S.car={x:58.5*TS,y:27.2*TS,face:0};
  if(S.mode==='boat'&&!S.gear.boat) S.mode='foot';
  if(S.mode==='scooter'&&!S.gear.scooter) S.mode='foot';
  if(S.mode==='car'&&(!S.car||!S.carModel)) S.mode='foot';
  if(P&&P._m){ scene.remove(P._m.root); meshReg.delete(P._m); }
  playerFromState(); if(S.mode==='boat'){P.x=S.boat.x;P.y=S.boat.y;} if(S.mode==='car'){P.x=S.car.x;P.y=S.car.y;}
  G.fish=null; G.hot=0; G.region=''; G.busy=false; G.warned=-1; G.race=null;
  genForage(); setupNPCs(); setupPeople(); setupTraffic();
  engineStop(); if(S.mode==='car') engineStart(S.carModel); else if(S.mode==='scooter') engineStart('scooter');
  G.mode='play'; $('#title').classList.add('hidden'); $('#hud').classList.remove('hidden'); applyTouch(); resize(); camSnap();
  updateHUD(true);
  if(fresh){ saveGame(true); setTimeout(()=>toast('Welcome to Pebble Cove, '+S.name+'! Your cottage is right behind you.','good'),500); setTimeout(()=>toast(isTouch()?'Drag on the left to walk and on the right to turn the camera. Tap Use to interact.':'WASD to move, E to use things, C to sneak, drag the mouse to turn the camera.'),2600); }
  else toast('Welcome back, '+S.name+'.','good');
}
function toTitle(){
  engineStop(); G.race=null;
  G.mode='title'; if(P&&P._m){ scene.remove(P._m.root); meshReg.delete(P._m); } S=null; P=null; G.fish=null; $('#reel').classList.add('hidden'); $('#prompt').classList.add('hidden');
  $('#hud').classList.add('hidden'); $('#touch').classList.add('hidden'); $('#title').classList.remove('hidden'); $('#edgeArrow').classList.add('hidden');
  setupNPCs(); setupPeople(); setupTraffic(); updateTitleButtons(); resize();
}
function updateTitleButtons(){ const has=!!anySave(); $('#tContinue').classList.toggle('hidden',!has); $('#tNew').classList.toggle('alt',has); }
$('#tContinue').addEventListener('click',()=>{ const last=loadJSON(SK+'last'); const d=(last&&slotData(last))||anySave(); if(d) startGame(d); });
$('#tNew').addEventListener('click',()=>{ newSlot=1; for(let n=1;n<=3;n++){ if(!slotData(n)){newSlot=n;break;} } ui.open('newgame'); });
$('#tLoad').addEventListener('click',()=>ui.open('load'));
$('#tSettings').addEventListener('click',()=>ui.open('settings'));
$('#tHow').addEventListener('click',()=>ui.open('how'));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.mode==='play'&&S&&!G.busy) saveGame(true); });

/* ================= loop ================= */
let last=performance.now(), promptT=0, firstFrame=true;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000); last=now; G.time+=dt;
  try{
    const paused=ui.stack.length>0||G.busy;
    if(G.mode==='play'&&S){
      if(!paused){ S.time+=dt*1.5; S.playTime+=dt; updateRace(dt); updatePlayer(dt); updateNPCs(dt); updatePeople(dt); updateTraffic(dt); updateFish(dt); }
      const f=1-Math.exp(-dt*6); camT.x=lerp(camT.x,P.x*U,f); camT.z=lerp(camT.z,P.y*U,f); camT.y=S.inside?0:lerp(camT.y,Math.max(0,groundY(P.x,P.y)),f);
      if(S.inside) camYaw+=angDiff(0,camYaw)*Math.min(1,dt*5);
      promptT-=dt; if(promptT<=0){promptT=.1; setPrompt(paused?null:nearestInteract()); updateHUD();}
    } else {
      updateNPCs(dt); updatePeople(dt); updateTraffic(dt);
      camYaw+=dt*.04; camT.set(40+Math.cos(G.time*.03)*6,.2,27+Math.sin(G.time*.04)*4);
    }
    placeCam();
    darkAmt=darkness(clock()); updateLighting(darkAmt);
    syncWorld(now); ambUpdate(dt);
    renderer.render(G.mode==='play'&&S&&S.inside?iScene:scene,camera);
    for(const el of labelEls.values()) if(el._s!==syncId&&el.style.display!=='none') el.style.display='none';
    if(firstFrame){ firstFrame=false; $('#loading').remove(); }
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
genMap(); genObjects(); buildBlockGrid(); setupNPCs();
applyGfx(); buildWorld(); buildInteriors(); setupPeople(); setupTraffic(); resize();
window.addEventListener('resize',resize);
updateTitleButtons(); refreshSaveNote();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>textTexes.forEach(t=>t._redraw()));
requestAnimationFrame(frame);
setTimeout(()=>Cloud.init(),50);
})();
</script>
